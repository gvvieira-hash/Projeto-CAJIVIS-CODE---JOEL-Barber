
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Joel Barber</title>

    <link rel="stylesheet" href="style2.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>
<body>

    <section class="login-page">

        <div class="overlay"></div>

        <div class="login-card">

            <img
                src="Logotipo_barbearia_profissional_cinza_e_vermelho-removebg-preview.png"
                class="logo"
                alt="Logo"
            >

            <h1>Crie seu Login</h1>

            <p>
                Sua barbearia, agora de cara nova. Crie sua conta e venha nos conhecer!
            </p>

            <form id="formCadastro">

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Usuário"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="Telefone"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="E-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Senha"
                        id="senha"
                        autocomplete="new-password"
                        required
                    >

                    <i class="fa-regular fa-eye-slash"></i>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Confirmar Senha"
                        id="confirmarSenha"
                        autocomplete="new-password"
                        required
                    >

                    <i class="fa-regular fa-eye-slash"></i>
                </div>

                <div class="options" id="opcoesTermos">
                    <label>
                        <input type="checkbox" id="termos">
                        Eu concordo com os termos de uso e a política de privacidade
                    </label>
                </div>

                <button type="submit" id="botaoCadastro">
                    CRIAR CONTA
                </button>

                <!-- CONFIRMAÇÃO DO E-MAIL -->
                <div class="area-codigo" id="areaCodigo" hidden>

                    <p>
                        Enviamos um código de confirmação para seu e-mail.
                        Digite os 6 números abaixo:
                    </p>

                    <div class="input-box">
                        <i class="fa-solid fa-key"></i>

                        <input
                            type="text"
                            id="codigoEmail"
                            placeholder="000000"
                            inputmode="numeric"
                            maxlength="6"
                            autocomplete="one-time-code"
                        >
                    </div>

                    <button type="button" id="botaoConfirmar">
                        CONFIRMAR E-MAIL
                    </button>

                </div>

            </form>

            <div class="register">
                <span>Já tem uma conta?</span>
                <a href="../index.html">Fazer login</a>
            </div>

        </div>

    </section>

    <script src="script2.js"></script>

</body>
</html>
